<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - MEDIAGENDA</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link href="css/custom.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <div class="container-fluid py-4">
      <!-- Welcome Header -->
      <div class="row mb-4">
        <div class="col-12">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h1 class="h3 mb-0" id="welcome-title">¡Bienvenido!</h1>
              <p class="text-muted mb-0" id="welcome-subtitle">Dashboard</p>
            </div>
            <div class="d-none d-md-block">
              <div class="badge bg-primary-soft text-primary px-3 py-2">
                <i class="bi bi-calendar-today me-2"></i>
                <span id="current-date"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Dashboard Content -->
      <div id="dashboard-content">
        <!-- Loading Spinner -->
        <div class="text-center py-5" id="loading-spinner">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
          <p class="text-muted mt-2">Cargando dashboard...</p>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        // Verificar autenticación
        if (!AuthManager.requireAuth()) {
          return;
        }

        // Renderizar navbar
        AuthManager.renderNavbar();

        // Mostrar fecha actual
        document.getElementById("current-date").textContent =
          new Date().toLocaleDateString("es-ES", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
          });

        // Personalizar bienvenida
        const user = AuthManager.getUser();
        if (user) {
          document.getElementById(
            "welcome-title"
          ).textContent = `¡Bienvenido, ${user.name}!`;
          document.getElementById("welcome-subtitle").textContent =
            DashboardManager.getSubtitleByRole(user.role);
        }

        // Cargar dashboard según el rol
        await DashboardManager.loadDashboard();
      });
    </script>
  </body>
</html>
