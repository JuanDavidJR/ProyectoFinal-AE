<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Mis Citas Médicas</title>
    <link rel="stylesheet" href="../public/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../public/css/styles.css" />
  </head>
  <body>
    <div class="container mt-5">
      <h1>Mis Citas Médicas</h1>

      <form id="appointmentForm" class="mb-4">
        <div class="form-group">
          <label>Nombre del doctor:</label>
          <input type="text" id="doctorName" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Fecha de la cita:</label>
          <input
            type="datetime-local"
            id="appointmentDate"
            class="form-control"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary mt-2">Crear Cita</button>
      </form>

      <h2>Citas Agendadas</h2>
      <ul id="appointmentsList" class="list-group"></ul>
    </div>

    <script type="module" src="../public/js/main.js"></script>
  </body>
</html>
