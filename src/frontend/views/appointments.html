<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Citas Médicas</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="mb-4">Mis Citas Médicas</h1>

      <form id="appointmentForm" class="mb-4">
        <fieldset>
          <div class="mb-3">
            <label for="doctorName" class="form-label"
              >Nombre del doctor:</label
            >
            <input type="text" id="doctorName" class="form-control" required />
          </div>

          <div class="mb-3">
            <label for="appointmentDate" class="form-label"
              >Fecha de la cita:</label
            >
            <input
              type="datetime-local"
              id="appointmentDate"
              class="form-control"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary">Crear Cita</button>
        </fieldset>
      </form>

      <h2 class="mb-3">Citas Agendadas</h2>
      <ul id="appointmentsList" class="list-group"></ul>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
